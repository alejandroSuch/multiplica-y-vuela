<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#83d8ed" />
    <meta name="description" content="Un juego de globos para practicar las tablas de multiplicar." />
    <title>¡Multiplica y vuela!</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="orientation-overlay" role="dialog" aria-modal="true" aria-label="Gira el dispositivo">
      <div class="orientation-card">
        <div class="orientation-icon" aria-hidden="true">↻</div>
        <h2>¡Gira tu dispositivo!</h2>
        <p>Este juego se disfruta mejor en vertical.</p>
        <button class="secondary-button orientation-dismiss" id="orientation-dismiss" type="button">Ya está en vertical, continuar</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
